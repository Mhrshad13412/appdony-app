name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore appdony.jks \
            -alias appdony \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -storepass Appdony@2024 \
            -keypass Appdony@2024 \
            -dname "CN=AppDony, OU=AppDony, O=AppDony, L=Tehran, ST=Tehran, C=IR"

      - name: Encode to Base64
        run: |
          base64 -w 0 appdony.jks > keystore_base64.txt
          echo "=========== BASE64 START ==========="
          cat keystore_base64.txt
          echo ""
          echo "=========== BASE64 END ==========="

      - name: Upload as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            appdony.jks
            keystore_base64.txt
