plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.appdony.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.appdony.app"
        minSdk 21
        targetSdk 34
        versionCode 1114
        versionName "1.1.14"
    }

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "Appdony@2024"
            keyAlias System.getenv("KEY_ALIAS") ?: "appdony"
            keyPassword System.getenv("KEY_PASSWORD") ?: "Appdony@2024"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
}
